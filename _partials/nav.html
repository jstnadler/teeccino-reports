<!--
  Shared top-nav partial for teeccino-reports dashboards.
  Owner: HubSmith. Modify only via clawd-hubsmith.

  How to include in a dashboard (no build step required):
      <div id="hub-nav"></div>
      <script>
        fetch('/teeccino-reports/_partials/nav.html')
          .then(r => r.text())
          .then(html => {
            var slot = document.getElementById('hub-nav');
            slot.innerHTML = html;
            document.body.classList.add('has-hub-nav');
            // Re-execute any <script> tags from the fragment (innerHTML does NOT run them).
            slot.querySelectorAll('script').forEach(function (s) {
              var n = document.createElement('script');
              if (s.src) { n.src = s.src; } else { n.textContent = s.textContent; }
              document.head.appendChild(n);
            });
          });
      </script>

  Aesthetics: gold #D4A843 on dark #1a1a2e, matches index.html. Uses inline <style scoped> equivalent
  (a <style> block is allowed inside fragment HTML when innerHTML'd into a div).
-->
<style>
  /* Scoped via #hub-nav-bar to avoid clashing with host page styles */
  #hub-nav-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    background: rgba(26, 26, 46, 0.95);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 12px 24px;
    display: flex; align-items: center; gap: 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  #hub-nav-bar .brand {
    font-weight: 700; font-size: 1.05em; color: #D4A843;
    text-decoration: none; letter-spacing: -0.02em;
  }
  #hub-nav-bar .brand:hover { color: #F5D784; }
  #hub-nav-bar .group {
    display: flex; align-items: center; gap: 14px;
    margin-left: 16px;
  }
  #hub-nav-bar .group-label {
    color: #64748b; font-size: 0.7em; text-transform: uppercase; letter-spacing: 0.08em;
    font-weight: 600;
  }
  #hub-nav-bar a.nav-link {
    color: #94a3b8; text-decoration: none; font-size: 0.88em;
    padding: 4px 10px; border-radius: 6px;
    transition: color 0.15s, background 0.15s;
  }
  #hub-nav-bar a.nav-link:hover {
    color: #D4A843; background: rgba(212, 168, 67, 0.08);
  }
  #hub-nav-bar a.nav-link.active {
    color: #D4A843; background: rgba(212, 168, 67, 0.12);
    font-weight: 600;
  }
  #hub-nav-bar .spacer { flex: 1; }

  /* ── Hub page search ───────────────────────────────────────────────────────
     Live client-side search over pages.json (single source → always in sync with
     the manifest). Logic lives in nav-boot.js (NEVER inline in an event-handler
     attribute — see the 2026-06-10 SyntaxError incident). Reachable from every
     page because the nav chrome is on every page. */
  #hub-search {
    position: relative; display: inline-flex; align-items: center;
  }
  #hub-search input {
    width: 180px; max-width: 38vw;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 6px;
    color: #e2e8f0; font-size: 0.85em;
    padding: 5px 10px 5px 28px;
    font-family: inherit;
    transition: border-color 0.15s, background 0.15s, width 0.15s;
  }
  #hub-search input::placeholder { color: #64748b; }
  #hub-search input:focus {
    outline: none; width: 240px;
    border-color: rgba(212, 168, 67, 0.5);
    background: rgba(255, 255, 255, 0.09);
  }
  #hub-search .search-icon {
    position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
    font-size: 0.8em; color: #64748b; pointer-events: none;
  }
  #hub-search-results {
    position: absolute; top: calc(100% + 6px); right: 0;
    width: 340px; max-width: 80vw; max-height: 60vh; overflow-y: auto;
    background: rgba(22, 22, 38, 0.98);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(212, 168, 67, 0.25); border-radius: 10px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    padding: 6px; z-index: 1001; display: none;
  }
  #hub-search-results.open { display: block; }
  #hub-search-results a.sr-item {
    display: block; text-decoration: none;
    padding: 8px 10px; border-radius: 7px;
    color: #e2e8f0;
  }
  #hub-search-results a.sr-item:hover,
  #hub-search-results a.sr-item.sr-active {
    background: rgba(212, 168, 67, 0.14);
  }
  #hub-search-results .sr-title {
    font-size: 0.88em; font-weight: 600; color: #D4A843;
    display: flex; align-items: center; gap: 7px;
  }
  #hub-search-results .sr-meta {
    font-size: 0.72em; color: #94a3b8; margin-top: 2px;
  }
  #hub-search-results .sr-cat {
    color: #64748b; text-transform: capitalize;
  }
  #hub-search-results .sr-empty {
    padding: 12px 10px; color: #94a3b8; font-size: 0.82em; text-align: center;
  }
  @media (max-width: 880px) {
    #hub-search input { width: 130px; }
    #hub-search input:focus { width: 160px; }
    #hub-search-results { width: 280px; }
  }

  #hub-nav-bar .home-link {
    color: #D4A843; font-size: 0.85em; text-decoration: none;
    border: 1px solid rgba(212, 168, 67, 0.3); padding: 4px 12px; border-radius: 6px;
    transition: background 0.15s;
  }
  #hub-nav-bar .home-link:hover { background: rgba(212, 168, 67, 0.1); }
  /* Allow the nav itself to wrap onto multiple rows on intermediate desktop widths.
     Original CSS only enabled flex-wrap at <=880px, so 1100-1699px viewports clipped content
     (or overflowed) instead of wrapping cleanly. With wrap enabled here, the JS sync below
     measures the actual rendered height and updates body padding to match. */
  #hub-nav-bar { flex-wrap: wrap; row-gap: 6px; }
  /* CSS fallback padding — applies before the JS sync runs (sub-100ms flash) and if JS is disabled.
     Covers the worst observed wrap (91px @ 1100-1499) plus the new flex-wrap behavior which can
     produce 2-3 row nav at narrower widths. The JS sync tightens this on wide viewports (down to
     ~61px when nav is single-line) and loosens it if the nav wraps deeper than expected. */
  body.has-hub-nav { padding-top: 140px !important; }
  @media (min-width: 1500px) {
    body.has-hub-nav { padding-top: 80px !important; }
  }
  @media (min-width: 1700px) {
    body.has-hub-nav { padding-top: 60px !important; }
  }
  @media (max-width: 880px) {
    #hub-nav-bar { gap: 8px; padding: 10px 12px; }
    #hub-nav-bar .group { margin-left: 0; gap: 8px; }
    #hub-nav-bar .group-label { display: none; }
    #hub-nav-bar a.nav-link { font-size: 0.8em; padding: 3px 8px; }
  }

  /* ── Report ownership badge ───────────────────────────────────────────────
     Subtle bar rendered directly under the nav on every report, telling Justin
     which agent maintains the page (single source of truth: pages.json `owner`).
     Tuned for LIGHT dashboard backgrounds (host pages are light; the nav is dark).
     IN-FLOW (not fixed/sticky) so it needs no body padding-top adjustment — the
     nav-height sync only clears the FIXED nav, and this bar simply pushes content
     down naturally below it. Distinct class (NOT .prov-banner) to avoid colliding
     with CatalogSmith's Data Provenance banner, which already owns .prov-banner. */
  #report-owner-badge {
    display: flex; align-items: center; gap: 8px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 0.8rem; line-height: 1.4;
    color: #475569;                              /* AA on light: ~7.5:1 */
    background: rgba(212, 168, 67, 0.07);        /* faint gold wash */
    border-bottom: 1px solid rgba(212, 168, 67, 0.30);
    padding: 7px 18px; margin: 0;
  }
  #report-owner-badge .rob-icon { font-size: 0.95rem; line-height: 1; }
  #report-owner-badge .rob-agent {
    display: inline-block;
    background: #1a1a2e; color: #D4A843;         /* gold-on-dark chip: ~7:1, AA */
    font-weight: 700; padding: 1px 8px; border-radius: 5px;
    letter-spacing: -0.01em;
  }
  #report-owner-badge .rob-to { font-weight: 700; color: #334155; } /* AA on light */
  #report-owner-badge.is-legacy {
    background: rgba(100, 116, 139, 0.08);
    border-bottom-color: rgba(100, 116, 139, 0.25);
    color: #64748b;
  }
</style>

<!--
  BOOTSTRAP TRICK: dashboards fetch this fragment and assign it via innerHTML, which per HTML spec
  does NOT execute <script> tags inserted that way. To make our nav-sync + active-link + ownership
  badge logic run without requiring every dashboard's include block to be rewritten, we use an <img>
  with an invalid src so onerror fires synchronously after innerHTML parsing. HTML event attributes
  (onerror/onload) DO get honored on innerHTML-injected elements — this is the well-known workaround.
  The <img> stays display:none and contributes nothing to layout.

  IMPORTANT: keep the onerror handler TRIVIAL. A previous version inlined the entire multi-line
  bootstrap IIFE here; as an HTML event-handler attribute it threw "SyntaxError: Invalid or
  unexpected token" in the live environment, so the badge/active-link/padding-sync all silently
  no-op'd. The fix: onerror only injects the external nav-boot.js (a real <script src> executes
  reliably even when its parent came from innerHTML, with no attribute-tokenization constraints).
  All bootstrap logic now lives in /teeccino-reports/_partials/nav-boot.js (Owner: HubSmith).
-->
<img src="data:," alt="" style="display:none"
     onerror="(function(){ if (window.__hubNavBoot) return; window.__hubNavBoot = true; var s = document.createElement('script'); s.src = '/teeccino-reports/_partials/nav-boot.js'; document.head.appendChild(s); })()">
