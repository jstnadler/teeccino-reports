  Owner: HubSmith. Modify only via clawd-hubsmith.

      <script>
        fetch('/teeccino-reports/burke/_nav.html')
          .then(r => r.text())
          .then(html => {
            document.getElementById('portal-nav').innerHTML = html;
            document.body.classList.add('has-portal-nav');
          });
      </script>

  Adding a dashboard link: add an <a class="nav-link" href="/teeccino-reports/burke/NAME.html">
  below. (Chrome is HubSmith-owned — Orinoco/DataOps dispatch HubSmith to add the link.)

    · GREEN (#6FCF7A) = a dashboard. Shows Burke numbers. Group "Dashboards".
    · GOLD  (#D4A843) = a governance surface. Waits on Burke's decision. Group "Needs You",
      rendered FIRST, with .nav-link.action styling.

  "Awaiting Burke" pill and its framing block, so the nav reads as continuous with the page.
  Do not give an analytics page .action styling; the signal only means something while it is rare.
