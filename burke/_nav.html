<!--
  PORTAL-SCOPED nav partial — Burke's portal (persona: Orinoco, Amazon channel).
  Owner: HubSmith. Modify only via clawd-hubsmith.

  ISOLATION (AGENT_STANDARDS §18): this nav links ONLY to pages inside burke/.
  It MUST NOT link to Justin's main hub (/teeccino-reports/index.html) or any of his
  dashboards — including Justin's own /teeccino-reports/amazon.html. Burke gets his
  OWN burke/amazon.html (built by Orinoco once the amazon-data-portal ingest ships).
  It deliberately does NOT load the shared nav (/_partials/nav.html) or its search
  (nav-boot.js searches Justin's pages.json — that would leak his dashboards here).
  No external manifest. ONE small portal-scoped script (burke/_theme.js, the Light/Dark switch)
  is loaded via the <img onerror> one-liner at the bottom — see the 2026-10-15 HISTORY entry.

  Accent = forest green (#2E7D32, Orinoco's color) to signal the Amazon portal.

  How the portal's own pages include it (index.html + any burke/*.html dashboard):
      <div id="portal-nav"></div>
      <script>
        fetch('/teeccino-reports/burke/_nav.html')
          .then(r => r.text())
          .then(html => {
            document.getElementById('portal-nav').innerHTML = html;
            document.body.classList.add('has-portal-nav');
          });
      </script>

  Adding a dashboard link: add an <a class="nav-link" href="/teeccino-reports/burke/NAME.html">
  below. (Chrome is HubSmith-owned — Orinoco/DataOps dispatch HubSmith to add the link.)

  TWO KINDS OF PAGE, TWO COLORS. The portal's convention:
    · GREEN (#6FCF7A) = a dashboard. Shows Burke numbers. Group "Dashboards".
    · GOLD  (#D4A843) = a governance surface. Waits on Burke's decision. Group "Needs You",
      rendered FIRST, with .nav-link.action styling.
  Gold is not a new color — it is the same gold amazon-decisions.html already uses for every
  "Awaiting Burke" pill and its framing block, so the nav reads as continuous with the page.
  Do not give an analytics page .action styling; the signal only means something while it is rare.

  HISTORY
  2026-08-04 — amazon-movers.html became the single brand-filtered movers page (in-page brand
  selector, nightly live rebuild), so the two brand-split pages amazon-movers-wb.html and

  2026-10-14 — added amazon-asin-daily.html ("Units by ASIN (Daily)", built nightly by DataOps'

  2026-10-15 — LIGHT MODE (Justin: "For burkes portal pages, we need to be able to see it off dark
  mode"). Added a Dark | Light switch at the right of this bar. Choice persists in
  localStorage['burke-portal-theme'] (default dark) and is applied as <html data-portal-theme>.
  This revises the old "no JS" rule ON PURPOSE: this nav is the ONLY hook shared by every portal
  page, and every page is regenerated daily, so the switch must ride in here or be lost at 07:00.
  Mechanics: <script> inserted via innerHTML does not run, so a one-statement <img onerror>
  injects burke/_theme.js (same pattern as the main hub's nav-boot.js, kept trivial on purpose —
  a multi-line inline handler broke that nav in 2026-06). Light rules live in burke/_theme.css,
  all gated on the attribute, so dark renders byte-for-byte as before. Isolation unchanged: both
  files are in burke/, fetch nothing, and read no manifest. Known gap: a light-mode reader sees
  ~0.2s of dark on each page load, because the page paints before this nav arrives; closing that
  needs a 1-line pre-paint hook in each generator (DataOps / Orinoco's call).
  2026-10-15 (later) — STICKY TABLE HEADERS + BAR OFFSET (Justin: "on the table, when you scroll
  down I want the headers to stay sticky on top"). Both live in burke/_theme.js, so no generated
  page is touched. The body top padding now reads --portal-nav-pad (real bar height + 16px,
  measured by ResizeObserver) instead of a constant 72px: at 1440 the bar wraps to ~88-92px and
  titles were sitting ~18px under it. Table headers are pinned by translateY'ing the header cells
  rather than CSS sticky, because the tables live in overflow-x:auto wrappers where sticky pins
  to the wrapper, not the page. See the comment block in _theme.js.

<style>
  /* Scoped via #portal-nav-bar so it never clashes with a host page or the main hub nav. */
  #portal-nav-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    background: rgba(20, 33, 24, 0.96);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    padding: 12px 24px;
    display: flex; align-items: center; gap: 16px;
    border-bottom: 1px solid rgba(46, 125, 50, 0.35);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    flex-wrap: wrap; row-gap: 6px;
  }
  #portal-nav-bar .brand {
    font-weight: 700; font-size: 1.05em; color: #6FCF7A;
    text-decoration: none; letter-spacing: -0.02em;
  }
  #portal-nav-bar .brand:hover { color: #A5E3AC; }
  #portal-nav-bar .portal-tag {
    color: #94a3b8; font-size: 0.7em; text-transform: uppercase; letter-spacing: 0.08em;
    font-weight: 600; border: 1px solid rgba(46, 125, 50, 0.4);
    padding: 2px 8px; border-radius: 999px; margin-left: 2px;
  }
  #portal-nav-bar .group { display: flex; align-items: center; gap: 14px; margin-left: 16px; }
  #portal-nav-bar .group-label {
    color: #64748b; font-size: 0.7em; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600;
  }
  #portal-nav-bar a.nav-link {
    color: #94a3b8; text-decoration: none; font-size: 0.88em;
    padding: 4px 10px; border-radius: 6px; transition: color 0.15s, background 0.15s;
  }
  #portal-nav-bar a.nav-link:hover { color: #6FCF7A; background: rgba(46, 125, 50, 0.1); }
  #portal-nav-bar a.nav-link.active { color: #6FCF7A; background: rgba(46, 125, 50, 0.16); font-weight: 600; }

  /* GOVERNANCE / ACTION treatment — gold, boxed, ahead of the dashboards.
     Reserved for pages awaiting Burke's decision (see the note in the header comment). */
  #portal-nav-bar .group.needs-you { margin-left: 14px; }
  #portal-nav-bar .group.needs-you .group-label { color: #D4A843; opacity: 0.85; }
  #portal-nav-bar a.nav-link.action {

    background: rgba(212, 168, 67, 0.10);
    display: inline-flex; align-items: center; gap: 6px;
  }
  #portal-nav-bar a.nav-link.action::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: #D4A843; flex: 0 0 auto;
  }
  #portal-nav-bar a.nav-link.action:hover {
    color: #F3D68F; background: rgba(212, 168, 67, 0.20); border-color: #D4A843;
  }
  #portal-nav-bar a.nav-link.action.active { color: #F3D68F; background: rgba(212, 168, 67, 0.22); }
  /* Divider so "needs a decision" reads as a different kind of thing from "shows numbers",
     not merely as the first dashboard in the same list. */
  #portal-nav-bar .group.needs-you + .group {
    border-left: 1px solid rgba(46, 125, 50, 0.28); padding-left: 16px;
  }

  #portal-nav-bar .spacer { flex: 1; }
  #portal-nav-bar .home-link {
    color: #6FCF7A; font-size: 0.85em; text-decoration: none;
    border: 1px solid rgba(46, 125, 50, 0.4); padding: 4px 12px; border-radius: 6px;
    transition: background 0.15s;
  }
  #portal-nav-bar .home-link:hover { background: rgba(46, 125, 50, 0.14); }

  /* ---- Light/Dark switch + the nav's own light skin (2026-10-15) ---- */
  #portal-nav-bar .theme-switch {
    display: inline-flex; border: 1px solid rgba(46, 125, 50, 0.4); border-radius: 999px;
    padding: 2px; gap: 2px;
  }
  #portal-nav-bar .theme-switch button {
    font: inherit; font-size: 0.78em; color: #94a3b8; background: transparent; border: 0;
    padding: 3px 10px; border-radius: 999px; cursor: pointer;
  }
  #portal-nav-bar .theme-switch button:hover { color: #6FCF7A; }
  #portal-nav-bar .theme-switch button[aria-pressed="true"] { background: rgba(46, 125, 50, 0.28); color: #E6F4E7; font-weight: 600; }
  #portal-nav-bar .theme-switch button:focus-visible { outline: 2px solid #6FCF7A; outline-offset: 1px; }
  html[data-portal-theme="light"] #portal-nav-bar {
    background: rgba(255, 255, 255, 0.96); border-bottom-color: #cfd8d2;
    box-shadow: 0 1px 3px rgba(20, 33, 26, 0.06);

  html[data-portal-theme="light"] #portal-nav-bar .brand:hover { color: #2E7D32; }

  html[data-portal-theme="light"] #portal-nav-bar a.nav-link { color: #3f4d44; }
  html[data-portal-theme="light"] #portal-nav-bar a.nav-link:hover { color: #1f6e2a; background: rgba(46, 125, 50, 0.08); }
  html[data-portal-theme="light"] #portal-nav-bar a.nav-link.active { color: #1f6e2a; background: rgba(46, 125, 50, 0.12); }
  html[data-portal-theme="light"] #portal-nav-bar .group.needs-you .group-label { color: #8a6a12; opacity: 1; }
  html[data-portal-theme="light"] #portal-nav-bar a.nav-link.action { color: #7a5c0c; border-color: #d9bd6a; background: #fdf8ea; }
  html[data-portal-theme="light"] #portal-nav-bar a.nav-link.action::before { background: #b58a1e; }
  html[data-portal-theme="light"] #portal-nav-bar a.nav-link.action:hover { color: #5e4608; background: #faf1d6; border-color: #b58a1e; }
  html[data-portal-theme="light"] #portal-nav-bar .group.needs-you + .group { border-left-color: #cfd8d2; }
  html[data-portal-theme="light"] #portal-nav-bar .home-link { color: #1f6e2a; border-color: #b9cfbd; }
  html[data-portal-theme="light"] #portal-nav-bar .home-link:hover { background: rgba(46, 125, 50, 0.08); }
  html[data-portal-theme="light"] #portal-nav-bar .theme-switch { border-color: #b9cfbd; }
  html[data-portal-theme="light"] #portal-nav-bar .theme-switch button { color: #55655b; }
  html[data-portal-theme="light"] #portal-nav-bar .theme-switch button[aria-pressed="true"] { background: #1f6e2a; color: #ffffff; }
  /* Real bar height + 16px gap, measured live by _theme.js (bar wraps to 2 rows at desktop widths). 72/96px = pre-measure fallback. */
  body.has-portal-nav { padding-top: var(--portal-nav-pad, 72px); }
  @media (max-width: 880px) {
    #portal-nav-bar { gap: 8px; padding: 10px 12px; }
    #portal-nav-bar .group { margin-left: 0; gap: 8px; }
    #portal-nav-bar .group-label { display: none; }
    #portal-nav-bar a.nav-link { font-size: 0.8em; padding: 3px 8px; }
    /* Groups wrap on narrow screens, so a left border would land mid-row and read as noise.
       The gold pill + dot carries the distinction on its own once the labels are hidden. */
    #portal-nav-bar .group.needs-you + .group { border-left: none; padding-left: 0; }
    #portal-nav-bar .group.needs-you { margin-left: 0; }
    body.has-portal-nav { padding-top: var(--portal-nav-pad, 96px); }
  }
</style>
