<style>
  :root {

  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;

  .updated-stamp { color:var(--text-dim); font-size:.75rem; }
  .tabs { display:inline-flex; gap:6px; margin-bottom:10px; }
  .tabs button { background:rgba(255,255,255,.05); border:1px solid var(--border); color:var(--text-dim);

  .tabs button.active { background:rgba(212,168,67,.2); color:#fde68a; border-color:rgba(212,168,67,.4); }
  .empty { padding:24px; text-align:center; color:var(--text-dim); font-style:italic; }

  .range-preset:hover { color:#fff; }
  .range-preset.active { background:rgba(212,168,67,.22); color:#fde68a; }
  .range-custom { display:inline-flex; align-items:center; gap:8px; font-size:.8rem; color:var(--text-dim); }
  .range-custom input[type=date] { background:rgba(255,255,255,.05); border:1px solid var(--border);

  .notes { margin:10px 0 4px; font-size:.78rem; color:var(--text-dim); }

<script>
(() => {
  const D = JSON.parse(document.getElementById('ta-payload').textContent);
  const fmtInt=(n)=>n==null?'--':Math.round(n).toLocaleString('en-US');
  const fmtMoney=(n)=>n==null?'--':'$'+n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
  const fmtPct=(n)=>n==null?'--':(n*100).toFixed(1)+'%';
  const fmtSec=(n)=>n==null?'--':(n>=60?(n/60).toFixed(1)+'m':Math.round(n)+'s');
  const esc=(s)=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  if (!D.ga4_available) {
    document.getElementById('content').innerHTML='<div class="empty">No GA4 traffic data yet. Run ingest_ga4.py.</div>';
    document.getElementById('range-bar').style.display='none';
    return;
  }

  const DAYS = D.days, FIRST = DAYS[0], LAST = DAYS[DAYS.length-1];
  const dayPos = new Map(DAYS.map((d,i)=>[d,i]));
  const PROV = new Set(D.provisional_days || []);

  // ---------- date helpers (string-based; no Date-parse timezone traps) ----------
  const addDays=(iso,n)=>{ const t=Date.UTC(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10))+n*864e5;
    const d=new Date(t); return d.toISOString().slice(0,10); };
  const shiftYear=(iso,n)=>{ const y=+iso.slice(0,4)+n, m=+iso.slice(5,7), dd=+iso.slice(8,10);
    const last=new Date(Date.UTC(y,m,0)).getUTCDate();
    return `${y}-${String(m).padStart(2,'0')}-${String(Math.min(dd,last)).padStart(2,'0')}`; };
  const clamp=(iso)=> iso<FIRST?FIRST:(iso>LAST?LAST:iso);

  // lower/upper bound over the sorted DAYS spine -> [lo,hi] inclusive index window
  function bounds(from,to){
    let lo=0, hi=DAYS.length-1, a=DAYS.length, b=-1;
    // first index >= from
    lo=0; hi=DAYS.length-1;
    while(lo<=hi){ const m=(lo+hi)>>1; if(DAYS[m]>=from){ a=m; hi=m-1; } else lo=m+1; }
    // last index <= to
    lo=0; hi=DAYS.length-1;
    while(lo<=hi){ const m=(lo+hi)>>1; if(DAYS[m]<=to){ b=m; lo=m+1; } else hi=m-1; }
    return (a>b) ? null : [a,b];
  }

  // recs are sorted by dayIdx (guaranteed by the builder) -> binary-search the slice
  function recSlice(recs, lo, hi){
    let a=recs.length, b=-1, l=0, r=recs.length-1;
    while(l<=r){ const m=(l+r)>>1; if(recs[m][0]>=lo){ a=m; r=m-1; } else l=m+1; }
    l=0; r=recs.length-1;
    while(l<=r){ const m=(l+r)>>1; if(recs[m][0]<=hi){ b=m; l=m+1; } else r=m-1; }
    return (a>b)?[0,0]:[a,b+1];
  }

  // ---------- aggregation ----------
  // engagement_rate is a GA4 row-scoped ratio and is NEVER summed or averaged:
  // it is recomputed at the aggregate as engaged_sessions / sessions.
  function aggTotals(from,to){
    const bn=bounds(from,to);
    if(!bn) return {days:0,sessions:0,new_users:0,engaged:0,secs:0,purchases:0,revenue:0,
                    new_sessions:0,returning_sessions:0,unknown_sessions:0};
    const [lo,hi]=bn, T=D.totals, N=D.newret;
    let s=0,nu=0,es=0,sec=0,pu=0,rev=0,ns=0,rs=0,uk=0;
    for(let i=lo;i<=hi;i++){ s+=T.s[i]; nu+=T.nu[i]; es+=T.es[i]; sec+=T.sec[i]; pu+=T.pu[i]; rev+=T.rev[i];
      ns+=N.ns[i]; rs+=N.rs[i]; uk+=N.uk[i]; }
    return {days:hi-lo+1, sessions:s, new_users:nu, engaged:es, secs:sec, purchases:pu, revenue:rev,
            new_sessions:ns, returning_sessions:rs, unknown_sessions:uk};
  }
  const rate=(a,b)=> b? a/b : null;

  function aggBy(recs, nEnt, lo, hi, nMetrics){
    const out = Array.from({length:nEnt}, ()=>new Array(nMetrics).fill(0));
    const [a,b]=recSlice(recs,lo,hi);
    for(let i=a;i<b;i++){ const r=recs[i], row=out[r[1]];
      for(let m=0;m<nMetrics;m++) row[m]+=r[2+m]; }
    return out;
  }
  function aggOther(recs, lo, hi, nMetrics){
    const out=new Array(nMetrics).fill(0);
    const [a,b]=recSlice(recs,lo,hi);
    for(let i=a;i<b;i++){ const r=recs[i]; for(let m=0;m<nMetrics;m++) out[m]+=r[1+m]; }
    return out;
  }

  // ---------- YoY, coverage-matched ----------
  // Equal DAY COUNTS, not equal date bounds. A retention wall or a coverage hole
  // in either window otherwise reads as a real move. If the counts differ we still
  // show the delta but label it, rather than presenting it as clean.
  function yoyBlock(from,to){
    const pf=shiftYear(from,-1), pt=shiftYear(to,-1);
    const cur=aggTotals(from,to), pri=aggTotals(pf,pt);
    return {cur, pri, from:pf, to:pt, matched: cur.days===pri.days && pri.days>0};
  }
  const delta=(c,p)=> (p==null||p===0||c==null)?null:(c-p)/p;

  function yoyPill(c,p,matched,invert){
    const d=delta(c,p);
    if(d==null) return '<span class="yoy flat">— no prior year</span>';
    const good = invert ? d<0 : d>0;
    const cls = d===0?'flat':(good?'up':'down');
    const arrow = d>0?'▲':(d<0?'▼':'■');
    const warn = matched?'':' <span class="chip warn" title="Prior-year window has a different number of days with data — this delta is not coverage-matched.">uneven</span>';
    return `<span class="yoy ${cls}">${arrow} ${(Math.abs(d)*100).toFixed(1)}% YoY</span>${warn}`;
  }

  // ---------- trend bucketing ----------
  function buckets(lo,hi){
    const n=hi-lo+1;
    const grain = n<=62 ? 'day' : (n<=400 ? 'week' : 'month');
    const keys=[], idx=[];
    let curKey=null;
    for(let i=lo;i<=hi;i++){
      const d=DAYS[i];
      let k;
      if(grain==='day') k=d;
      else if(grain==='month') k=d.slice(0,7);
      else { // ISO-ish week start (Monday) of that date
        const t=Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10));
        const dow=(new Date(t)).getUTCDay(); const off=(dow+6)%7;
        k=new Date(t-off*864e5).toISOString().slice(0,10);
      }
      if(k!==curKey){ curKey=k; keys.push(k); idx.push([i,i]); }
      else idx[idx.length-1][1]=i;
    }
    return {grain, keys, idx};
  }

    <div class="subtitle" style="margin-top:-2px;font-size:.78rem;" id="methodology">${esc(D.methodology)}</div>

    <h2>Sessions by Channel Group</h2>
    <div class="grid-2">
      <div class="chart-wrap"><h3 id="donut-h3">Share of sessions</h3><canvas id="donut"></canvas></div>
      <div class="card" style="padding:0;">
        <table class="data-table" id="ch-table"><thead><tr>
          <th>Channel</th><th class="num">Sessions</th><th class="num">Share</th>
          <th class="num">Eng. Rate</th><th class="num">YoY</th><th class="num">Revenue</th>
        </tr></thead><tbody></tbody></table>
      </div>
    </div>

    <h2>Sessions Trend by Channel</h2>
    <div class="chart-wrap"><div class="subtitle" id="trend-note" style="margin-bottom:6px;"></div><canvas id="trend"></canvas></div>

    <h2>Source / Medium &amp; Device</h2>
    <div class="grid-2">
      <div class="card" style="padding:0;">
        <table class="data-table" id="sm-table"><thead><tr>
          <th>Source / Medium</th><th>Channel</th><th class="num">Sessions</th>
          <th class="num">Eng. Rate</th><th class="num">Avg Time</th><th class="num">Revenue</th>
        </tr></thead><tbody></tbody></table>
        <div class="notes" style="padding:0 12px 10px;" id="sm-note"></div>
      </div>
      <div><div class="chart-wrap"><h3>Device split</h3><canvas id="device"></canvas></div></div>
    </div>

    <h2>Top Landing Pages</h2>
    <div class="card" style="padding:0;">
      <table class="data-table" id="lp-table"><thead><tr>
        <th>Landing Page</th><th class="num">Sessions</th><th class="num">Eng. Rate</th>
        <th class="num">Purchases</th><th class="num">Revenue</th>
      </tr></thead><tbody></tbody></table>
      <div class="notes" style="padding:0 12px 10px;" id="lp-note"></div>
    </div>`;

  let donutChart=null, trendChart=null, deviceChart=null;

  function renderRange(from,to){
    const bn=bounds(from,to);
    const cap=document.getElementById('range-caption');
    if(!bn){
      document.getElementById('kpis').innerHTML='<div class="empty" style="grid-column:1/-1;">No GA4 data in the selected range.</div>';
      cap.innerHTML=`<b>${esc(from)}</b> → <b>${esc(to)}</b> · no data`;
      return;
    }
    const [lo,hi]=bn;

    // ---- hero KPIs ----
    const y=yoyBlock(from,to), c=y.cur, p=y.pri;
    const engR=rate(c.engaged,c.sessions), engRp=rate(p.engaged,p.sessions);
    const convR=rate(c.purchases,c.sessions), convRp=rate(p.purchases,p.sessions);
    const knownC=c.new_sessions+c.returning_sessions, knownP=p.new_sessions+p.returning_sessions;
    const newPct=rate(c.new_sessions,knownC), newPctP=rate(p.new_sessions,knownP);
    document.getElementById('kpis').innerHTML = `
      <div class="kpi"><div class="label">Sessions</div><div class="num">${fmtInt(c.sessions)}</div>${yoyPill(c.sessions,p.sessions,y.matched)}</div>
      <div class="kpi"><div class="label">New Users</div><div class="num">${fmtInt(c.new_users)}</div>${yoyPill(c.new_users,p.new_users,y.matched)}</div>
      <div class="kpi"><div class="label">% New Sessions</div><div class="num">${fmtPct(newPct)}</div>
        <span class="yoy flat">${fmtInt(c.new_sessions)} new · ${fmtInt(c.returning_sessions)} ret</span></div>
      <div class="kpi"><div class="label">Engagement Rate</div><div class="num">${fmtPct(engR)}</div>${yoyPill(engR,engRp,y.matched)}</div>
      <div class="kpi"><div class="label">Avg Engagement</div><div class="num">${fmtSec(c.sessions?c.secs/c.sessions:null)}</div>
        <span class="yoy flat">per session</span></div>
      <div class="kpi"><div class="label">GA4 Conv. Rate</div><div class="num">${fmtPct(convR)}</div>${yoyPill(convR,convRp,y.matched)}</div>
      <div class="kpi"><div class="label">GA4 Revenue</div><div class="num">${fmtMoney(c.revenue)}</div>
        <span class="yoy flat">${fmtInt(c.purchases)} purchases</span></div>`;

    // ---- range caption + notes ----
    const provIn = DAYS.slice(lo,hi+1).filter(d=>PROV.has(d));
    const botIn = (D.bot_windows||[]).filter(w => !(w.end<from || w.start>to));
    cap.innerHTML = `<b>${esc(DAYS[lo])}</b> → <b>${esc(DAYS[hi])}</b> · ${c.days} day${c.days===1?'':'s'}`
      + ` &nbsp;·&nbsp; vs <b>${esc(y.from)}</b> → <b>${esc(y.to)}</b> (${p.days}d)`;
    const notes=[];
    if(!y.matched && p.days>0) notes.push(`<span class="chip warn">YoY not coverage-matched</span> prior-year window has ${p.days} day(s) with data vs ${c.days} — the % changes above compare unequal windows.`);
    if(p.days===0) notes.push(`<span class="chip info">No prior-year data</span> the matching ${esc(y.from)} → ${esc(y.to)} window has no GA4 rows, so YoY is not shown.`);
    if(provIn.length) notes.push(`<span class="chip warn">Provisional</span> ${provIn.length} day(s) in range (${esc(provIn[0])}${provIn.length>1?' … '+esc(provIn[provIn.length-1]):''}) were ingested within ${D.provisional_lag_days} days of the date — i.e. captured before GA4 finished settling them — and have not been re-pulled since. Their figures are likely understated. Re-pull with ingest_ga4.py to repair.`);
    if(botIn.length) notes.push(`<span class="chip info">Bot sessions removed</span> ${botIn.map(w=>esc(w.label)+' ('+esc(w.start)+'→'+esc(w.end)+', '+fmtInt(w.sessions_removed)+' sessions)').join('; ')}.`);
    document.getElementById('range-notes').innerHTML = notes.join('<br>');
    document.getElementById('window-label').textContent =
      `${DAYS[lo]} → ${DAYS[hi]} · ${c.days} days of GA4 traffic · YoY vs ${y.from} → ${y.to}`;

    // ---- channel table + donut ----
    const chAgg=aggBy(D.ch_recs, D.channels.length, lo, hi, 4);      // s, eng, purch, rev
    const pbn=bounds(shiftYear(from,-1), shiftYear(to,-1));
    const chPri = pbn ? aggBy(D.ch_recs, D.channels.length, pbn[0], pbn[1], 4) : null;
    const chTot = chAgg.reduce((a,r)=>a+r[0],0) || 1;
    const chRows = D.channels.map((ch,i)=>({
      name:ch.name, color:ch.color, sessions:chAgg[i][0], engaged:chAgg[i][1],
      purchases:chAgg[i][2], revenue:chAgg[i][3],
      share:chAgg[i][0]/chTot,
      yoy: chPri ? delta(chAgg[i][0], chPri[i][0]) : null,
    })).filter(r=>r.sessions>0).sort((a,b)=>b.sessions-a.sessions);
    document.querySelector('#ch-table tbody').innerHTML = chRows.length ? chRows.map(r=>{
      const yv = r.yoy==null?'<span class="flat">—</span>'
        : `<span class="${r.yoy>0?'up':(r.yoy<0?'down':'flat')}">${r.yoy>0?'+':''}${(r.yoy*100).toFixed(0)}%</span>`;
      return `<tr><td><span class="swatch" style="background:${esc(r.color)}"></span>${esc(r.name)}</td>
        <td class="num">${fmtInt(r.sessions)}</td><td class="num">${fmtPct(r.share)}</td>
        <td class="num">${fmtPct(rate(r.engaged,r.sessions))}</td><td class="num">${yv}</td>
        <td class="num">${fmtMoney(r.revenue)}</td></tr>`;
    }).join('') : '<tr><td colspan="6" class="empty" style="border:0;">No channel data in range</td></tr>';

    const topCh=chRows.slice(0,8);
    if(donutChart) donutChart.destroy();
    donutChart=new Chart(document.getElementById('donut'),{
      type:'doughnut',
      data:{labels:topCh.map(r=>r.name),datasets:[{data:topCh.map(r=>r.sessions),
        backgroundColor:topCh.map(r=>r.color),borderColor:'#1a1a2e',borderWidth:2}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',
        labels:{color:'#e2e8f0',usePointStyle:true,padding:10,font:{size:11}}}}}
    });

    // ---- trend ----
    const B=buckets(lo,hi);
    const topNames=new Set(chRows.slice(0,6).map(r=>r.name));
    const series=new Map();  // name -> array over buckets
    chRows.slice(0,6).forEach(r=>series.set(r.name, new Array(B.keys.length).fill(0)));
    let hasOther=false;
    const otherArr=new Array(B.keys.length).fill(0);
    const chName=D.channels.map(c0=>c0.name);
    B.idx.forEach(([a,b],bi)=>{
      const agg=aggBy(D.ch_recs, D.channels.length, a, b, 1);
      agg.forEach((row,i)=>{
        if(!row[0]) return;
        const nm=chName[i];
        if(topNames.has(nm)) series.get(nm)[bi]+=row[0];
        else { otherArr[bi]+=row[0]; hasOther=true; }
      });
    });
    const colorOf=(nm)=> (D.channels.find(c0=>c0.name===nm)||{}).color || '#94a3b8';
    const datasets=[...series.entries()].map(([nm,data])=>({label:nm,backgroundColor:colorOf(nm)+'cc',
      borderColor:colorOf(nm),data,fill:true,tension:.25,pointRadius:0}));
    if(hasOther) datasets.push({label:'Other',backgroundColor:'#475569cc',borderColor:'#475569',
      data:otherArr,fill:true,tension:.25,pointRadius:0});
    document.getElementById('trend-note').textContent =
      `${B.keys.length} ${B.grain==='day'?'days':(B.grain==='week'?'weeks (Mon-start)':'months')} · top 6 channels in range, remainder grouped as Other`;
    if(trendChart) trendChart.destroy();
    trendChart=new Chart(document.getElementById('trend'),{
      type:'line',data:{labels:B.keys,datasets},
      options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
        plugins:{legend:{position:'bottom',labels:{color:'#e2e8f0',usePointStyle:true,padding:10,font:{size:11}}}},
        scales:{x:{stacked:true,ticks:{color:'#888',maxRotation:0,autoSkip:true,maxTicksLimit:14},grid:{color:'rgba(255,255,255,.04)'}},
          y:{stacked:true,beginAtZero:true,ticks:{color:'#888'},grid:{color:'rgba(255,255,255,.06)'}}}}
    });

    // ---- device ----
    const devAgg=aggBy(D.dev_recs, D.devices.length, lo, hi, 2);
    const devRows=D.devices.map((d,i)=>({name:d.name,color:d.color,sessions:devAgg[i][0]}))
      .filter(r=>r.sessions>0).sort((a,b)=>b.sessions-a.sessions);
    if(deviceChart) deviceChart.destroy();
    deviceChart=new Chart(document.getElementById('device'),{
      type:'doughnut',
      data:{labels:devRows.map(r=>r.name),datasets:[{data:devRows.map(r=>r.sessions),
        backgroundColor:devRows.map(r=>r.color),borderColor:'#1a1a2e',borderWidth:2}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',
        labels:{color:'#e2e8f0',usePointStyle:true,padding:10,font:{size:11}}}}}
    });

    renderDetail(from,to);
  }

  // ---- source/medium + landing come from the lazily-fetched detail feed ----
  function detailBounds(from,to){
    if(!DETAIL) return null;
    const dd=DETAIL.days;
    let a=dd.length,b=-1,l=0,r=dd.length-1;
    while(l<=r){ const m=(l+r)>>1; if(dd[m]>=from){a=m;r=m-1;} else l=m+1; }
    l=0; r=dd.length-1;
    while(l<=r){ const m=(l+r)>>1; if(dd[m]<=to){b=m;l=m+1;} else r=m-1; }
    return (a>b)?null:[a,b];
  }
  function renderDetail(from,to){
    const smBody=document.querySelector('#sm-table tbody'), lpBody=document.querySelector('#lp-table tbody');
    const smNote=document.getElementById('sm-note'), lpNote=document.getElementById('lp-note');
    if(detailState==='loading'){
      smBody.innerHTML='<tr><td colspan="6" class="empty" style="border:0;">Loading detail feed…</td></tr>';
      lpBody.innerHTML='<tr><td colspan="5" class="empty" style="border:0;">Loading detail feed…</td></tr>';
      return;
    }
    if(detailState==='error'){
      const msg='Detail feed unavailable — source/medium and landing-page breakdowns cannot be shown. (traffic-acquisition-detail.json failed to load.)';
      smBody.innerHTML=`<tr><td colspan="6" class="empty" style="border:0;">${msg}</td></tr>`;
      lpBody.innerHTML=`<tr><td colspan="5" class="empty" style="border:0;">${msg}</td></tr>`;
      return;
    }
    const bn=detailBounds(from,to);
    const clipped = from < DETAIL.floor;
    const clipNote = clipped
      ? `<span class="chip warn">Range clipped</span> daily source/landing detail is kept from <b>${esc(DETAIL.floor)}</b> onward; this table covers ${esc(bn?DETAIL.days[bn[0]]:'—')} → ${esc(bn?DETAIL.days[bn[1]]:'—')}, not the full selected range. `
      : '';
    if(!bn){
      smBody.innerHTML='<tr><td colspan="6" class="empty" style="border:0;">No source/medium detail in range</td></tr>';
      lpBody.innerHTML='<tr><td colspan="5" class="empty" style="border:0;">No landing-page detail in range</td></tr>';
      smNote.innerHTML=clipNote; lpNote.innerHTML=clipNote;
      return;
    }
    const [lo,hi]=bn;

    // source / medium — metrics: s, eng, secs, purch, rev
    const smA=aggBy(DETAIL.sm.recs, DETAIL.sm.entities.length, lo, hi, 5);
    const smO=aggOther(DETAIL.sm.other, lo, hi, 5);
    const smRows=DETAIL.sm.entities.map((e,i)=>({src:e[0],med:e[1],ch:e[2],
      s:smA[i][0],eng:smA[i][1],secs:smA[i][2],pu:smA[i][3],rev:smA[i][4]}))
      .filter(r=>r.s>0).sort((a,b)=>b.s-a.s);
    smBody.innerHTML = smRows.length ? smRows.slice(0,25).map(r=>`
      <tr><td class="nm">${esc(r.src)} / ${esc(r.med)}</td><td>${esc(r.ch)}</td>
      <td class="num">${fmtInt(r.s)}</td><td class="num">${fmtPct(rate(r.eng,r.s))}</td>
      <td class="num">${fmtSec(r.s?r.secs/r.s:null)}</td><td class="num">${fmtMoney(r.rev)}</td></tr>`).join('')
      : '<tr><td colspan="6" class="empty" style="border:0;">No source/medium data in range</td></tr>';
    const smKept=smRows.reduce((a,r)=>a+r.s,0), smAll=smKept+smO[0];
    smNote.innerHTML = clipNote + `Top 25 of ${fmtInt(smRows.length)} tracked source/medium pairs. `
      + `Tracked pairs cover <b>${fmtPct(smAll?smKept/smAll:0)}</b> of sessions in this range; `
      + `the remaining ${fmtInt(smO[0])} sessions sit in a long tail that is not kept at daily grain.`;

    // landing pages — metrics: s, eng, purch, rev
    const lpA=aggBy(DETAIL.lp.recs, DETAIL.lp.entities.length, lo, hi, 4);
    const lpO=aggOther(DETAIL.lp.other, lo, hi, 4);
    const lpRows=DETAIL.lp.entities.map((pg,i)=>({page:pg,s:lpA[i][0],eng:lpA[i][1],pu:lpA[i][2],rev:lpA[i][3]}))
      .filter(r=>r.s>0).sort((a,b)=>b.s-a.s);
    lpBody.innerHTML = lpRows.length ? lpRows.slice(0,25).map(r=>`
      <tr><td class="nm">${esc(r.page)}</td><td class="num">${fmtInt(r.s)}</td>
      <td class="num">${fmtPct(rate(r.eng,r.s))}</td><td class="num">${fmtInt(r.pu)}</td>
      <td class="num">${fmtMoney(r.rev)}</td></tr>`).join('')
      : '<tr><td colspan="5" class="empty" style="border:0;">No landing-page data in range</td></tr>';
    const lpKept=lpRows.reduce((a,r)=>a+r.s,0), lpAll=lpKept+lpO[0];
    lpNote.innerHTML = clipNote + `Top 25 of ${fmtInt(lpRows.length)} tracked landing pages. `
      + `Tracked pages cover <b>${fmtPct(lpAll?lpKept/lpAll:0)}</b> of landing sessions in this range; `
      + `${fmtInt(lpO[0])} sessions land on the long tail of ${fmtInt(DETAIL.lp.total_pages)} total pages, which is not kept at daily grain.`;
  }

  // ---------- range controls ----------
  const startEl=document.getElementById('range-start'), endEl=document.getElementById('range-end');
  const presetBtns=[...document.querySelectorAll('.range-preset')];
  startEl.min=endEl.min=FIRST; startEl.max=endEl.max=LAST;

  function resolvePreset(p){
    if(p==='all') return [FIRST,LAST];
    if(p==='mtd') return [LAST.slice(0,8)+'01', LAST];
    if(p==='ytd') return [LAST.slice(0,4)+'-01-01', LAST];
    if(p==='qtd'){ const m=+LAST.slice(5,7), qm=m-((m-1)%3);
      return [`${LAST.slice(0,4)}-${String(qm).padStart(2,'0')}-01`, LAST]; }
    if(p==='lastmonth'){ const first=LAST.slice(0,8)+'01';
      const end=addDays(first,-1); return [end.slice(0,8)+'01', end]; }
    const n=parseInt(p,10);
    return [clamp(addDays(LAST,-(n-1))), LAST];
  }
  function setActivePreset(p){ presetBtns.forEach(b=>b.classList.toggle('active', b.dataset.preset===p)); }

  function apply(from,to,preset){
    from=clamp(from); to=clamp(to);
    if(from>to){ const t=from; from=to; to=t; }   // safety net for ?from=/?to= only
    startEl.value=from; endEl.value=to;
    setActivePreset(preset||'');
    try{ history.replaceState(null,'',`?from=${from}&to=${to}`); }catch(e){}
    renderRange(from,to);
  }
  presetBtns.forEach(b=>b.addEventListener('click',()=>{
    const [f,t]=resolvePreset(b.dataset.preset); apply(f,t,b.dataset.preset);
  }));
  // A user picks a NEW START first, then the end. If that start lands after the
  // current end, swapping the two silently rewrites the field they just typed and
  // the follow-up end edit then produces a range they never asked for. Push the
  // OTHER endpoint instead — the edited field is always left as typed.
  startEl.addEventListener('change',()=>{
    const f=clamp(startEl.value||FIRST);
    const t=(endEl.value && endEl.value>=f) ? clamp(endEl.value) : f;
    apply(f,t,'');
  });
  endEl.addEventListener('change',()=>{
    const t=clamp(endEl.value||LAST);
    const f=(startEl.value && startEl.value<=t) ? clamp(startEl.value) : t;
    apply(f,t,'');
  });

  // initial range: ?from=&to= if present and valid, else MTD
  const qs=new URLSearchParams(location.search);
  const qf=qs.get('from'), qt=qs.get('to');
  const ISO=/^\d{4}-\d{2}-\d{2}$/;
  if(qf&&qt&&ISO.test(qf)&&ISO.test(qt)) apply(qf,qt,'');
  else { const [f,t]=resolvePreset('mtd'); apply(f,t,'mtd'); }

  // lazy-load the heavy detail feed, then re-render the two tables
  fetch(D.detail.feed, {cache:'no-cache'})
    .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(j=>{ DETAIL=j; detailState='ready'; renderDetail(startEl.value, endEl.value); })
    .catch(()=>{ detailState='error'; renderDetail(startEl.value, endEl.value); });
})();
</script>
</body>
</html>
