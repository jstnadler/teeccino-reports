<script>
(() => {
  const D = JSON.parse(document.getElementById('ta-payload').textContent);
  const fmtInt=(n)=>n==null?'--':Math.round(n).toLocaleString('en-US');
  const fmtMoney=(n)=>n==null?'--':'$'+n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
  const fmtPct=(n)=>n==null?'--':(n*100).toFixed(1)+'%';
  const fmtSec=(n)=>n==null?'--':(n>=60?(n/60).toFixed(1)+'m':Math.round(n)+'s');
  const esc=(s)=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

  if (!D.ga4_available) {
    document.getElementById('content').innerHTML='<div class="empty">No GA4 traffic data yet. Run ingest_ga4.py.</div>';
    return;
  }
  document.getElementById('window-label').textContent =
    D.hero.month_label + ' — ' + D.hero.window_label + '  ·  ' + D.hero.yoy_window_label + ' (YoY)';

  // ---- YoY pill helper ----
  const yoyPill=(d,invert=false,isPct=false)=>{
    if (d.pct==null) return '<span class="yoy flat">— no prior yr</span>';
    const good = invert ? d.pct<0 : d.pct>0;
    const cls = d.pct===0?'flat':(good?'up':'down');
    const arrow = d.pct>0?'▲':(d.pct<0?'▼':'■');
    return `<span class="yoy ${cls}">${arrow} ${(Math.abs(d.pct)*100).toFixed(1)}% YoY</span>`;
  };

  // ---- Hero KPIs ----
  const h=D.hero;
  document.getElementById('content').insertAdjacentHTML('beforeend', `
    <div class="kpi-grid">
      <div class="kpi"><div class="label">Sessions (MTD)</div><div class="num">${fmtInt(h.sessions.value)}</div>${yoyPill(h.sessions)}</div>
      <div class="kpi"><div class="label">New Users (MTD)</div><div class="num">${fmtInt(h.new_users.value)}</div>${yoyPill(h.new_users)}</div>
      <div class="kpi"><div class="label">% New Sessions</div><div class="num">${fmtPct(h.new_session_pct.value)}</div>
        <div class="yoy flat">${fmtInt(h.new_sessions)} new · ${fmtInt(h.returning_sessions)} ret</div></div>
      <div class="kpi"><div class="label">Engagement Rate</div><div class="num">${fmtPct(h.engagement_rate.value)}</div>${yoyPill(h.engagement_rate)}</div>
      <div class="kpi"><div class="label">GA4 Conv. Rate</div><div class="num">${fmtPct(h.ga4_conv_rate.value)}</div>${yoyPill(h.ga4_conv_rate)}</div>
    </div>
    <div class="subtitle" style="margin-top:-2px;font-size:.78rem;">${D.methodology}</div>`);

  // ---- Channel donut + table ----
  document.getElementById('content').insertAdjacentHTML('beforeend', `
    <h2>Sessions by Channel Group</h2>
    <div class="grid-2">
      <div class="chart-wrap"><h3>Share of sessions (MTD)</h3><canvas id="donut"></canvas></div>
      <div class="card" style="padding:0;overflow:hidden;">
        <table class="data-table" id="ch-table"><thead><tr>
          <th>Channel</th><th>Sessions</th><th>Share</th><th>Eng. Rate</th><th>YoY</th><th>Revenue</th>
        </tr></thead><tbody></tbody></table>
      </div>
    </div>`);
  document.querySelector('#ch-table tbody').innerHTML = D.by_channel.map(c=>{
    const yoy = c.yoy_pct==null?'<span class="flat">—</span>':
      `<span class="${c.yoy_pct>0?'up':(c.yoy_pct<0?'down':'flat')}">${c.yoy_pct>0?'+':''}${(c.yoy_pct*100).toFixed(0)}%</span>`;
    return `<tr><td><span class="swatch" style="background:${c.color}"></span>${esc(c.channel)}</td>
      <td>${fmtInt(c.sessions)}</td><td>${fmtPct(c.share)}</td><td>${fmtPct(c.engagement_rate)}</td>
      <td>${yoy}</td><td>${fmtMoney(c.revenue)}</td></tr>`;
  }).join('');
  const topCh=D.by_channel.slice(0,8);
  new Chart(document.getElementById('donut'),{
    type:'doughnut',
    data:{labels:topCh.map(c=>c.channel),datasets:[{data:topCh.map(c=>c.sessions),
      backgroundColor:topCh.map(c=>c.color),borderColor:'#1a1a2e',borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',
      labels:{color:'#e2e8f0',usePointStyle:true,padding:10,font:{size:11}}}}}
  });

  // ---- Sessions-by-channel trend (MTD daily + 24mo monthly tabs) ----
  document.getElementById('content').insertAdjacentHTML('beforeend', `
    <h2>Sessions Trend by Channel</h2>
    <div class="tabs"><button id="tab-daily" class="active">Daily (MTD)</button><button id="tab-monthly">Monthly (24mo)</button></div>
    <div class="chart-wrap"><canvas id="trend"></canvas></div>`);
  let trendChart=null;
  function drawTrend(mode){
    const src = mode==='daily'?D.daily_trend:D.monthly_trend;
    const labels = mode==='daily'?src.dates:src.months;
    const datasets = src.channels.map(c=>({label:c.channel,backgroundColor:c.color+'cc',
      borderColor:c.color,data:c.data,fill:true,tension:.25,pointRadius:0}));
    if (trendChart) trendChart.destroy();
    trendChart=new Chart(document.getElementById('trend'),{
      type:'line',data:{labels,datasets},
      options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
        plugins:{legend:{position:'bottom',labels:{color:'#e2e8f0',usePointStyle:true,padding:10,font:{size:11}}}},
        scales:{x:{stacked:true,ticks:{color:'#888',maxRotation:0,autoSkip:true,maxTicksLimit:12},grid:{color:'rgba(255,255,255,.04)'}},
          y:{stacked:true,beginAtZero:true,ticks:{color:'#888'},grid:{color:'rgba(255,255,255,.06)'}}}}
    });
  }
  drawTrend('daily');
  document.getElementById('tab-daily').onclick=function(){this.classList.add('active');document.getElementById('tab-monthly').classList.remove('active');drawTrend('daily');};
  document.getElementById('tab-monthly').onclick=function(){this.classList.add('active');document.getElementById('tab-daily').classList.remove('active');drawTrend('monthly');};

  // ---- Source / Medium + Device ----
  document.getElementById('content').insertAdjacentHTML('beforeend', `
    <h2>Source / Medium &amp; Device</h2>
    <div class="grid-2">
      <div class="card" style="padding:0;overflow:hidden;">
        <table class="data-table" id="sm-table"><thead><tr>
          <th>Source / Medium</th><th>Channel</th><th>Sessions</th><th>Eng. Rate</th><th>Avg Time</th><th>Revenue</th>
        </tr></thead><tbody></tbody></table>
      </div>
      <div>
        <div class="chart-wrap"><h3>Device split</h3><canvas id="device"></canvas></div>
      </div>
    </div>`);
  document.querySelector('#sm-table tbody').innerHTML = D.by_source_medium.map(r=>`
    <tr><td>${esc(r.source)} / ${esc(r.medium)}</td><td>${esc(r.channel)}</td>
    <td>${fmtInt(r.sessions)}</td><td>${fmtPct(r.engagement_rate)}</td>
    <td>${fmtSec(r.avg_engagement_secs)}</td><td>${fmtMoney(r.revenue)}</td></tr>`).join('');
  new Chart(document.getElementById('device'),{
    type:'doughnut',
    data:{labels:D.by_device.map(d=>d.device),datasets:[{data:D.by_device.map(d=>d.sessions),
      backgroundColor:D.by_device.map(d=>d.color),borderColor:'#1a1a2e',borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',
      labels:{color:'#e2e8f0',usePointStyle:true,padding:10,font:{size:11}}}}}
  });

  // ---- Top landing pages ----
  document.getElementById('content').insertAdjacentHTML('beforeend', `
    <h2>Top Landing Pages (MTD)</h2>
    <div class="card" style="padding:0;overflow:hidden;">
      <table class="data-table" id="lp-table"><thead><tr>
        <th>Landing Page</th><th>&nbsp;</th><th>Sessions</th><th>Eng. Rate</th><th>Purchases</th><th>Revenue</th>
      </tr></thead><tbody></tbody></table>
    </div>`);
  document.querySelector('#lp-table tbody').innerHTML = D.top_landing.map(p=>`
    <tr><td colspan="2">${esc(p.page)}</td><td>${fmtInt(p.sessions)}</td>
    <td>${fmtPct(p.engagement_rate)}</td><td>${fmtInt(p.purchases)}</td><td>${fmtMoney(p.revenue)}</td></tr>`).join('');
})();
</script>
