p:10px;flex-wrap:wrap;margin-bottom:6px;align-items:center\">\n    <select id=\"metric\"><option value=\"reach\">Reach<\/option><option value=\"views\">Views<\/option><option value=\"total_interactions\">Interactions<\/option><option value=\"profile_views\">Profile views<\/option><option value=\"website_clicks\">Website clicks<\/option><option value=\"accounts_engaged\">Accounts engaged<\/option><option value=\"saves\">Saves<\/option><option value=\"shares\">Shares<\/option><\/select>\n    <label class=\"chk\"><input type=\"checkbox\" id=\"ma\" checked> 7-day average<\/label>\n    <label class=\"chk\"><input type=\"checkbox\" id=\"mk\" checked> Mark post days<\/label>\n    <span class=\"note\" id=\"trendnote\"><\/span>\n  <\/div>\n  <div id=\"trend\"><\/div>\n<\/div>\n<div class=\"two\">\n  <div class=\"card\"><h2 style=\"margin-top:0\">Followers<\/h2><p class=\"lead\">Snapshots only; gaps are days we didn't capture a count.<\/p><div id=\"fol\"><\/div><\/div>\n  <div class=\"card\"><h2 style=\"margin-top:0\">Attention to action<\/h2><p class=\"lead\">Account-wide, selected range.<\/p><div id=\"funnel\"><\/div><\/div>\n<\/div>\n\n<h2>Calendar<\/h2>\n<p class=\"lead\">Every post on the day it went out (Pacific time). Shading is that day's account reach. Click a post to open it on Instagram.<\/p>\n<div class=\"card\">\n  <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px\">\n    <button class=\"btn\" id=\"cprev\">‹ Prev<\/button><b id=\"cmonth\" style=\"min-width:130px;text-align:center\"><\/b><button class=\"btn\" id=\"cnext\">Next ›<\/button>\n    <button class=\"btn\" id=\"clatest\">Jump to selected range<\/button>\n    <select id=\"cshade\"><option value=\"reach\">Shade by account reach<\/option><option value=\"none\">No shading<\/option><\/select>\n    <select id=\"cmode\"><option value=\"all\">All posts<\/option><option value=\"REELS\">Reels only<\/option><option value=\"FEED\">Feed posts only<\/option><option value=\"give\">Giveaways only<\/option><\/select>\n    <span class=\"note\" id=\"cnote\"><\/span>\n  <\/div>\n  <div id=\"cal\"><\/div>\n<\/div>\n\n<h2>Findings<\/h2>\n<div class=\"card\"><ul class=\"find\" id=\"findings\"><\/ul><p class=\"note\">Generated from the selected range. These are directional, and small samples are called out.<\/p><\/div>\n\n<h2>What works<\/h2>\n<div class=\"two\">\n  <div class=\"card\"><h3 style=\"font-size:.9rem;margin-bottom:6px\">Format<\/h3><table id=\"t_fmt\"><\/table><\/div>\n  <div class=\"card\"><h3 style=\"font-size:.9rem;margin-bottom:6px\">Giveaway vs everything else<\/h3><table id=\"t_give\"><\/table><\/div>\n<\/div>\n<div class=\"card\"><h3 style=\"font-size:.9rem;margin-bottom:2px\">Content themes<\/h3><p class=\"lead\">Tagged from caption wording, so one post can sit in more than one theme. A theme is a guess about the post, not a label we entered.<\/p><table id=\"t_theme\"><\/table><\/div>\n<div class=\"two\">\n  <div class=\"card\"><h3 style=\"font-size:.9rem;margin-bottom:2px\">Day of week<\/h3><p class=\"lead\">Grey rows have fewer than 5 posts.<\/p><table id=\"t_dow\"><\/table><\/div>\n  <div class=\"card\"><h3 style=\"font-size:.9rem;margin-bottom:2px\">Time of day (Pacific)<\/h3><p class=\"lead\">Grey rows have fewer than 5 posts.<\/p><table id=\"t_hour\"><\/table><\/div>\n<\/div>\n<div class=\"two\">\n  <div class=\"card\"><h3 style=\"font-size:.9rem;margin-bottom:2px\">Caption length<\/h3><table id=\"t_len\"><\/table><\/div>\n  <div class=\"card\"><h3 style=\"font-size:.9rem;margin-bottom:2px\">Posting rhythm<\/h3><p class=\"lead\">Posts per week in range.<\/p><div id=\"weeks\"><\/div><\/div>\n<\/div>\n<div class=\"card\"><h3 style=\"font-size:.9rem;margin-bottom:2px\">Where results come from<\/h3><div id=\"conc\" class=\"note\" style=\"font-size:.88rem\"><\/div><\/div>\n\n<h2>Posts<\/h2>\n<div class=\"card\">\n  <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center\">\n    <input id=\"q\" placeholder=\"Search captions\" style=\"min-width:200px\">\n    <select id=\"ftype\"><option value=\"\">All formats<\/option><option value=\"REELS\">Reels<\/option><option value=\"FEED\">Feed posts<\/option><\/select>\n    <select id=\"ftheme\"><option value=\"\">All themes<\/option><\/select>\n    <select id=\"fgive\"><option value=\"\">Giveaways and others<\/option><option value=\"1\">Giveaways only<\/option><option value=\"0\">Exclude giveaways<\/option><\/select>\n    <button class=\"btn\" id=\"csv\">Download CSV<\/button>\n    <span class=\"note\" id=\"pcount\"><\/span>\n  <\/div>\n  <div style=\"overflow-x:auto\"><table id=\"posts\"><\/table><\/div>\n  <div class=\"pager\"><button id=\"prev\">‹ Prev<\/button><span id=\"pg\"><\/span><button id=\"next\">Next ›<\/button><\/div>\n  <p class=\"note\" style=\"margin-top:8px\">Click a caption to expand it, or the date to open the post on Instagram. Thumbnails come from Instagram and can expire between refreshes. \"Vs range median\" compares a post's reach with the median post in the selected date range. The post pop-up compares with the median for that post's calendar month instead, so the two numbers can differ.<\/p>\n<\/div>\n\n<h2>How to read this<\/h2>\n<div class=\"card note\" style=\"font-size:.84rem\"><ul class=\"find\">\n<li><b>Instagram only.<\/b> TikTok, Pinterest, Facebook, Stories and comment text aren't in this data.<\/li>\n<li><b>Account reach is much larger than post reach.<\/b> Account reach counts anyone who saw anything from us that day; post reach counts that post only. We haven't verified what makes up the difference, so don't add them up.<\/li>\n<li><b>Engagement rate<\/b> here is interactions divided by reach. Post-level uses that post's reach; account-level uses the day's account reach.<\/li>\n<li><b>Daily account data starts <span id=\"apistart\"><\/span>.<\/b> Earlier rows only have follower counts. The latest day is left out because Instagram's numbers for it are incomplete.<\/li>\n<li>Post counts xt-align:center}\n<\/style><\/head><body>\n\n<div class=\"wrap\">\n<h1>Facebook Page performance<\/h1>\n<p class=\"sub\" id=\"sub\"><\/p>\n<div class=\"info\"><b>Post-level data only for now.<\/b> This page shows what people did on each post: reactions, comments and shares. Reach, views, clicks and follower history are not available yet, because Meta requires an extra permission we haven't switched on. Those numbers will appear here once it's on.<\/div>\n\n<div class=\"bar\">\n  <div class=\"presets\" id=\"presets\">\n    <button data-p=\"7\">Last 7d<\/button><button data-p=\"30\" class=\"active\">Last 30d<\/button><button data-p=\"90\">Last 90d<\/button>\n    <button data-p=\"mtd\">MTD<\/button><button data-p=\"lastmonth\">Last month<\/button><button data-p=\"qtd\">QTD<\/button><button data-p=\"ytd\">YTD<\/button><button data-p=\"all\">All<\/button>\n  <\/div>\n  <span><input type=\"date\" id=\"from\"> – <input type=\"date\" id=\"to\"><\/span>\n  <select id=\"cmpmode\" title=\"Comparison\"><option value=\"prior\">Compare: prior period<\/option><option value=\"yoy\">Compare: same dates last year<\/option><option value=\"none\">No comparison<\/option><\/select>\n  <span class=\"note\" id=\"rangeinfo\"><\/span>\n<\/div>\n<div id=\"warn\"><\/div>\n\n<h2>Scorecard<\/h2><div class=\"kpis\" id=\"kpis\"><\/div>\n\n<h2>Trend<\/h2>\n<div class=\"card\">\n  <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px;align-items:center\">\n    <select id=\"metric\"><option value=\"eng\">Engagements<\/option><option value=\"posts\">Posts<\/option><option value=\"re\">Reactions<\/option><option value=\"com\">Comments<\/option><option value=\"shr\">Shares<\/option><\/select>\n    <label class=\"chk\"><input type=\"checkbox\" id=\"mk\" checked> Mark post days<\/label>\n    <span class=\"note\" id=\"trendnote\"><\/span>\n  <\/div>\n  <div id=\"trend\"><\/div>\n<\/div>\n\n<div class=\"two\">\n  <div class=\"card\"><h2 style=\"margin-top:0\">Reaction mix<\/h2><p class=\"lead\">Share of all reactions in the selected date range. The post pop-up compares with the median for that post's calendar month instead, so the two numbers can differ.<\/p><div id=\"mix\"><\/div><\/div>\n  <div class=\"card\"><h2 style=\"margin-top:0\">Followers<\/h2><div id=\"fol\"><\/div><\/div>\n<\/div>\n\n<h2>Calendar<\/h2>\n<p class=\"lead\">Every post on the day it went out (Pacific time). Click a post to open it on Facebook.<\/p>\n<div class=\"card\">\n  <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px\">\n    <button class=\"btn\" id=\"cprev\">‹ Prev<\/button><b id=\"cmonth\" style=\"min-width:130px;text-align:center\"><\/b><button class=\"btn\" id=\"cnext\">Next ›<\/button>\n    <button class=\"btn\" id=\"clatest\">Jump to selected range<\/button>\n    <select id=\"cmode\"><option value=\"all\">All posts<\/option><option value=\"video\">Videos only<\/option><option value=\"photo\">Photos and albums only<\/option><option value=\"give\">Giveaways only<\/option><\/select>\n    <span class=\"note\" id=\"cnote\"><\/span>\n  <\/div>\n  <div id=\"cal\"><\/div>\n<\/div>\n\n<h2>Findings<\/h2>\n<div class=\"card\"><ul class=\"find\" id=\"findings\"><\/ul><p class=\"note\">Generated from the selected range. Directional only, and small samples are called out.<\/p><\/div>\n\n<h2>What works<\/h2>\n<div class=\"two\">\n  <div class=\"card\"><h3 style=\"font-size:.9rem;margin-bottom:6px\">Post type<\/h3><table id=\"t_type\"><\/table><\/div>\n  <div class=\"card\"><h3 style=\"font-size:.9rem;margin-bottom:6px\">Giveaway vs everything else<\/h3><table id=\"t_give\"><\/table><\/div>\n<\/div>\n<div class=\"card\"><h3 style=\"font-size:.9rem;margin-bottom:2px\">Content themes<\/h3><p class=\"lead\">Tagged from caption wording, so one post can sit in more than one theme. A theme is a guess about the post, not a label we entered.<\/p><table id=\"t_theme\"><\/table><\/div>\n<div class=\"two\">\n  <div class=\"card\"><h3 style=\"font-size:.9rem;margin-bottom:2px\">Day of week<\/h3><p class=\"lead\">Grey rows have fewer than 5 posts.<\/p><table id=\"t_dow\"><\/table><\/div>\n  <div class=\"card\"><h3 style=\"font-size:.9rem;margin-bottom:2px\">Time of day (Pacific)<\/h3><p class=\"lead\">Grey rows have fewer than 5 posts.<\/p><table id=\"t_hour\"><\/table><\/div>\n<\/div>\n<div class=\"two\">\n  <div class=\"card\"><h3 style=\"font-size:.9rem;margin-bottom:2px\">Caption length<\/h3><table id=\"t_len\"><\/table><\/div>\n  <div class=\"card\"><h3 style=\"font-size:.9rem;margin-bottom:2px\">Posting rhythm<\/h3><p class=\"lead\">Posts per week in range.<\/p><div id=\"weeks\"><\/div><\/div>\n<\/div>\n<div class=\"card\"><h3 style=\"font-size:.9rem;margin-bottom:2px\">Where results come from<\/h3><div id=\"conc\" class=\"note\" style=\"font-size:.88rem\"><\/div><\/div>\n\n<h2>Posts<\/h2>\n<div class=\"card\">\n  <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center\">\n    <input id=\"q\" placeholder=\"Search posts\" style=\"min-width:200px\">\n    <select id=\"ftype\"><option value=\"\">All types<\/option><option value=\"video\">Videos<\/option><option value=\"photo\">Photos<\/option><option value=\"album\">Albums<\/option><option value=\"other\">Other (status, event, link)<\/option><\/select>\n    <select id=\"ftheme\"><option value=\"\">All themes<\/option><\/select>\n    <select id=\"fgive\"><option value=\"\">Giveaways and others<\/option><option value=\"1\">Giveaways only<\/option><option value=\"0\">Exclude giveaways<\/option><\/select>\n    <button class=\"btn\" id=\"csv\">Download CSV<\/button>\n    <span class=\"note\" id=\"pcount\"><\/span>\n  <\/div>\n  <div style=\"overflow-x:auto\"><table id=\"posts\"><\/table><\/div>\n  <div class=\"pager\"><button id=\"prev\">‹ Prev<\/button><span id=\"pg\"><\/span><button id=\"next\">Next ›<\/button><\/div>\n  <p class=\"note\" style=\"margin-top:8px\">Click a caption to expand it, or the date to open the post on Facebook. \"Vs range median\" compares a post's engagements with the median post in the selected range.<\/p>\n<\/div>\n\n<h2>How to read this<\/h2>\n<div class=\"card note\" style=\"font-size:.84rem\"><ul class=\"find\">\n<li><b>Facebook Page only.<\/b> Instagram, TikTok and Pinterest are not in this view, and the Instagram dashboard counts things differently, so don't compare numbers across the two.<\/li>\n<li><b>Engagements<\/b> here means reactions + comments + shares on a post. It is not Facebook's own \"post engagements\" metric, which also counts clicks and isn't available to us yet.<\/li>\n<li><b>Shares:<\/b> Meta leaves the share count out when a post has none. We treat a missing share count as zero in these totals.<\/li>\n<li><b>Counts are lifetime totals as of the latest read<\/b> (<span id=\"lastread\"><\/span>). Older posts have had time to collect everything; the newest posts are still gathering reactions, so the most recent days will look low.<\/li>\n<li><b>Followers:<\/b> Meta only reports the current total, so our history starts the day we began saving it. Nothing is filled in for earlier dates.<\/li>\n<li><b>Post data runs from <span id=\"firstpost\"><\/span>.<\/b> Posts before 2024 exist on the Page but aren't loaded here. Times are Pacific. Giveaway and theme tags are matched from caption wording.<\/li>\n<\/ul><\/div>\n<footer id=\"foot\"><\/footer>\n<\/div>\n<div class=\"modal-bg\" id=\"mbg\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Post details\"><div class=\"modal\"><button class=\"x\" id=\"mx\" aria-label=\"Close\">&times;<\/button><div id=\"mbody\"><\/div>\n<div class=\"mnav\"><button class=\"btn\" id=\"mprev\">&lsaquo; Previous post<\/button><span id=\"mpos\"><\/span><button class=\"btn\" id=\"mnext\">Next post &rsaquo;<\/button><\/div><\/div><\/div>\n<script>\nconst D={\"generated\": \"2026-11-26T08:52-08:00\", \"last_read\": \"2026-11-26T15:16:13+00:00\", \"posts\": [{\"id\": \"39455754108_788146046690207\", \"ts\": \"2024-01-02T01:55:09Z\", \"t\": \ const HINT={instagram:'Instagram: reach, views, interactions, saves and shares.',facebook:'Facebook: reactions, comments and shares per post. Reach and views follow once Meta\'s insights permission is added.'};
const frames={instagram:document.getElementById('f-ig'),facebook:document.getElementById('f-fb')};
const tabs={instagram:document.getElementById('t-ig'),facebook:document.getElementById('t-fb')};
const loaded={};
function show(p,push){
  if(!SRC[p])p='instagram';
  if(!loaded[p]){frames[p].srcdoc=SRC[p];loaded[p]=true}
  for(const k in frames){frames[k].classList.toggle('on',k===p);tabs[k].classList.toggle('on',k===p);tabs[k].setAttribute('aria-selected',k===p)}
  document.getElementById('hint').textContent=HINT[p];
  if(push!==false&&location.hash!=='#'+p)history.replaceState(null,'','#'+p);
}
for(const k in tabs)tabs[k].onclick=()=>show(k);
window.addEventListener('hashchange',()=>show(location.hash.slice(1),false));
show(location.hash.slice(1)||'instagram',false);
</script>
