  <rect x="6"  y="18" width="5" height="8"  rx="1.5" fill="#D4A843"/>
  <rect x="13.5" y="12" width="5" height="14" rx="1.5" fill="#D4A843"/>
  <rect x="21" y="6"  width="5" height="20" rx="1.5" fill="#D4A843"/>
</svg>
